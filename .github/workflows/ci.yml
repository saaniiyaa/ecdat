name: ECDAT CI - Enterprise Cryptographic Discovery & Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Initialize Test SQLite Database
        run: |
          python -m app.manage init-db

      - name: Run Pytest Suite
        run: |
          python -m pytest tests/ -v

      - name: Verify the demo estate scans end to end
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/v1/health || { echo "API never became healthy"; exit 1; }
          python -m app.manage demo-scan --api-key dev-ecdat-key --base-url http://127.0.0.1:8000

  accuracy-gate:
    name: Accuracy Gate (real-world corpora)
    runs-on: ubuntu-latest
    # The published precision/recall figures are only true if something checks
    # them. This job re-measures three hand-labelled corpora and fails the build
    # on a regression, so a detector change cannot silently invalidate a claim
    # in docs/ACCURACY.md and the README.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start API
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/v1/health || { echo "API never became healthy"; exit 1; }

      - name: Accuracy gate
        env:
          ECDAT_BASE_URL: http://127.0.0.1:8000/api/v1
          ECDAT_API_KEY: dev-ecdat-key
        run: python scripts/accuracy_gate.py

      - name: Accuracy summary is consistent with the published document
        run: |
          # docs/ACCURACY.md quotes numbers in prose. If the measurement moves,
          # the prose must be corrected in the same commit, not left stale.
          python scripts/check_claims.py

  frontend-build:
    name: Frontend Build & Typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # `npm run build` runs tsc for the app but not for vite.config.ts, which
      # is a separate tsconfig. The proxy target is read from process.env, so a
      # missing @types/node would only surface when someone runs the dev
      # server - which is exactly when it is least convenient.
      - name: Typecheck (app + vite config)
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npx tsc --noEmit -p tsconfig.node.json

      - name: Build
        working-directory: frontend
        run: npm run build
