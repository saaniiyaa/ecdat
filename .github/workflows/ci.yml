name: ECDAT CI - Enterprise Cryptographic Discovery & Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Initialize Test SQLite Database
        run: |
          python -m app.manage init-db

      - name: Run Pytest Suite (95 Automated Tests)
        run: |
          python -m pytest tests/ -v

      - name: Verify Live Demo Estate & Accuracy Benchmark
        run: |
          # Start background API
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 4
          # Seed demo scan
          python -m app.manage demo-scan --api-key dev-ecdat-key --base-url http://127.0.0.1:8000
          # Run detector precision/recall accuracy benchmark
          python scripts/accuracy.py

  frontend-build:
    name: Frontend Build & Typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and Build (tsc && vite build)
        working-directory: frontend
        run: npm run build
