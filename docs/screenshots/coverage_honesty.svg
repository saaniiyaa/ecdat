<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#bg3)"/>

  <g transform="translate(40, 30)">
    <text x="0" y="25" fill="#f8fafc" font-family="monospace" font-size="20" font-weight="bold">Coverage Honesty &amp; Accounting Panel (Rule 6.1 &amp; 6.4)</text>
    <text x="0" y="48" fill="#94a3b8" font-family="monospace" font-size="12">Absence of findings is never reported as quantum-safe: uninspected surfaces are strictly itemised.</text>

    <!-- Main Gauge Box -->
    <rect x="0" y="70" width="1120" height="120" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <rect x="25" y="95" width="220" height="32" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
    <text x="40" y="116" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">Coverage Index: 0.983</text>

    <rect x="260" y="95" width="180" height="32" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="275" y="116" fill="#f59e0b" font-family="monospace" font-size="13" font-weight="bold">Unobserved: 1.7%</text>

    <text x="25" y="155" fill="#e2e8f0" font-family="sans-serif" font-size="15" font-weight="bold">Mandatory Statement (Rule 6.1): "No vulnerable artefacts detected within the scanned scope"</text>
    <text x="25" y="175" fill="#94a3b8" font-family="sans-serif" font-size="12">Deterministic guarantees only cover inspected AST, X.509 ASN.1, binary symbols, configs, and manifests.</text>

    <!-- Unobserved Surfaces Table (Rule 6.4) -->
    <rect x="0" y="210" width="1120" height="230" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="25" y="240" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="bold">UNOBSERVED SURFACES LEDGER (Rule 6.4)</text>
    
    <!-- Header -->
    <rect x="20" y="255" width="1080" height="26" fill="#030712"/>
    <text x="35" y="272" fill="#9ca3af" font-family="monospace" font-size="11">SURFACE PATH</text>
    <text x="320" y="272" fill="#9ca3af" font-family="monospace" font-size="11">KIND</text>
    <text x="480" y="272" fill="#9ca3af" font-family="monospace" font-size="11">OBSERVATION STATE</text>
    <text x="700" y="272" fill="#9ca3af" font-family="monospace" font-size="11">HONEST ACCOUNTING REASON</text>

    <!-- Item 1 -->
    <rect x="20" y="290" width="1080" height="45" fill="#0f172a" rx="4"/>
    <text x="35" y="317" fill="#f1f5f9" font-family="monospace" font-size="12" font-weight="bold">data/blob.dat</text>
    <text x="320" y="317" fill="#94a3b8" font-family="monospace" font-size="12">other</text>
    <rect x="480" y="303" width="90" height="24" rx="4" fill="#78350f" stroke="#d97706" stroke-width="1"/>
    <text x="500" y="319" fill="#fef3c7" font-family="monospace" font-size="11" font-weight="bold">PARTIAL</text>
    <text x="700" y="317" fill="#cbd5e1" font-family="monospace" font-size="12">Binary content in a text-classified file</text>

    <!-- Item 2 -->
    <rect x="20" y="345" width="1080" height="45" fill="#0f172a" rx="4"/>
    <text x="35" y="372" fill="#f1f5f9" font-family="monospace" font-size="12" font-weight="bold">README.md</text>
    <text x="320" y="372" fill="#94a3b8" font-family="monospace" font-size="12">other</text>
    <rect x="480" y="358" width="115" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="492" y="374" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold">UNSUPPORTED</text>
    <text x="700" y="372" fill="#cbd5e1" font-family="monospace" font-size="12">No detector registered for Markdown (.md)</text>
  </g>
</svg>
