[pytest]
# Third-party corpora live under fixtures/ and carry their own test suites
# (PyJWT ships 475 of them). A bare `pytest` at the repo root used to collect
# those too, so the reported suite size was 637 instead of this project's real
# count -- and a published "N tests" claim is a measured claim. Scope collection
# to our own tests explicitly.
testpaths = tests
norecursedirs = fixtures frontend .git .venv node_modules build dist
