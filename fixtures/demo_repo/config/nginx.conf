# Legacy edge terminator (kept for the ECDAT demonstration)
server {
    listen 443 ssl;
    server_name payments.example.gov;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-SHA:DES-CBC3-SHA:RC4-SHA:NULL-SHA:EXPORT-grade';
    ssl_certificate     /etc/ssl/certs/payments_leaf.pem;
    ssl_certificate_key /etc/ssl/private/payments_leaf.key;
    ssl_dhparam         /etc/ssl/dhparam/weak2048.pem;

    ssl_session_cache shared:SSL:10m;
}
